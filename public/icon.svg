<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0E0A08" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#E59D35" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="256" cy="256" r="142" fill="#1A120D" stroke="#E59D35" stroke-opacity="0.2" stroke-width="1.5" />
  <!-- Warm amber glow -->
  <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#E59D35" stop-opacity="0.65" />
    <stop offset="60%" stop-color="#B84935" stop-opacity="0.2" />
    <stop offset="100%" stop-color="#0E0A08" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="256" r="130" fill="url(#emberGlow)" />
  <!-- Pressed chamomile blossom -->
  <g transform="translate(256 256)">
    <g fill="#F6F2EA" stroke="#15100E" stroke-width="2.5">
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(0)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(45)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(90)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(135)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(180)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(225)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(270)" />
      <ellipse cx="0" cy="-48" rx="14" ry="32" transform="rotate(315)" />
    </g>
    <circle cx="0" cy="0" r="22" fill="#E59D35" stroke="#15100E" stroke-width="3" />
    <circle cx="-5" cy="-5" r="5" fill="#FFF3D1" opacity="0.7" />
  </g>
</svg>
